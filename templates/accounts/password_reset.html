{% extends 'base.html' %}

{% block title %}Reset Password - SHMS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16 bg-white shadow-md rounded-xl p-8">

    <div class="text-center mb-6">
        <div class="w-14 h-14 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-3">
            <svg class="w-7 h-7 text-blue-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-blue-700">Reset Your Password</h1>
        <p class="text-gray-500 text-sm mt-1">
            Enter your email address and we'll send you a link to reset your password.
        </p>
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-sm font-medium mb-1">Email Address</label>
            <input type="email" name="email" required
                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="Enter your registered email">
        </div>
        <button type="submit"
                class="btn-shine w-full bg-blue-700 text-white py-3 rounded-lg hover:bg-blue-800 transition font-medium">
            Send Reset Link
        </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-4">
        Remember your password?
        <a href="{% url 'accounts:login' %}" class="text-blue-600 hover:underline">Login here</a>
    </p>
</div>
{% endblock %}
