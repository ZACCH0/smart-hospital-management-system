{% extends 'base.html' %}

{% block title %}Reset Password — SHMS{% endblock %}

{% block public_content %}
<div class="max-w-7xl mx-auto px-5 sm:px-6 py-10">
    <div class="w-full max-w-md mx-auto app-card p-6 sm:p-8">
        <div class="text-center mb-5">
            <span class="app-icontile mx-auto mb-3" aria-hidden="true">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
            </span>
            <h1 class="text-xl sm:text-2xl font-bold text-slate-900">Reset Your Password</h1>
            <p class="text-[13.5px] text-slate-500 mt-1">Enter your email address and we will send you a link to reset your password.</p>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-[12.5px] font-semibold text-slate-700 mb-1">Email Address</label>
                <input type="email" name="email" required placeholder="Enter your registered email"
                       class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-teal-600">
            </div>
            <button type="submit" class="btn btn-primary w-full justify-center">Send Reset Link</button>
        </form>
        <p class="text-center text-[13px] text-slate-500 mt-4">Remember your password? <a href="{% url 'accounts:login' %}" class="text-teal-700 font-semibold hover:underline">Login here</a></p>
    </div>
</div>
{% endblock %}
