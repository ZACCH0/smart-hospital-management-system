{% extends 'base.html' %}

{% block title %}Login - SHMS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16 bg-white shadow-md rounded-lg p-8">
    <h1 class="text-2xl font-bold text-blue-700 mb-6 text-center">Login</h1>

    {% if form.errors %}
        <div class="bg-red-100 text-red-700 px-4 py-2 rounded mb-4 text-sm">
            Invalid email or password. Please try again.
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="mb-4">
            <label class="block text-sm font-medium mb-1" for="id_username">Email</label>
            <input type="email" name="username" id="id_username"
                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium mb-1" for="id_password">Password</label>
            <input type="password" name="password" id="id_password"
                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <button type="submit"
                class="w-full bg-blue-700 text-white py-2 rounded hover:bg-blue-800 transition">
            Log In
        </button>
        <p class="text-center text-sm text-gray-500 mt-4">
    New patient?
    <a href="{% url 'accounts:register' %}" class="text-blue-600 hover:underline">
        Create an account
    </a>
    <div class="text-center mt-3">
    <a href="{% url 'accounts:password_reset' %}" class="text-sm text-blue-600 hover:underline">
        Forgot your password?
    </a>
</div>
</p>
    </form>
</div>
{% endblock %}
