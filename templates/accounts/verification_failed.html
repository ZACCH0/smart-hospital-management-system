{% extends 'base.html' %}

{% block title %}Verification Failed - SHMS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16 bg-white shadow-md rounded-xl p-8 text-center">

    <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M6 18L18 6M6 6l12 12"/>
        </svg>
    </div>

    <h1 class="text-2xl font-bold text-gray-800 mb-2">Verification Failed</h1>
    <p class="text-gray-500 mb-6">
        This verification link is invalid or has already been used.
        Please request a new verification email.
    </p>

    <form method="post" action="{% url 'accounts:resend_verification' %}">
        {% csrf_token %}
        <div class="mb-3">
            <input type="email" name="email" required
                   placeholder="Enter your email address"
                   class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <button type="submit"
                class="w-full bg-blue-700 text-white py-2 rounded-lg hover:bg-blue-800 transition text-sm font-medium">
            Resend Verification Email
        </button>
    </form>

    <div class="mt-4">
        <a href="{% url 'accounts:login' %}" class="text-sm text-gray-400 hover:text-blue-600 transition">
            Back to Login
        </a>
    </div>

</div>
{% endblock %}
