{% extends 'base.html' %}

{% block title %}Disable 2FA — SHMS{% endblock %}

{% block content %}
<div class="w-full max-w-md mx-auto app-card p-6 sm:p-8 text-center">
    <span class="app-icontile app-icontile--rose mx-auto mb-4" aria-hidden="true">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
    </span>
    <h1 class="text-xl sm:text-2xl font-bold text-slate-900 mb-2">Disable Two-Factor Authentication</h1>
    <p class="text-[13.5px] text-slate-500 mb-5">Disabling 2FA will make your account less secure. You will be required to set it up again on next login.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger w-full justify-center mb-3">Yes, Disable 2FA</button>
    </form>
    <a href="{% url 'accounts:role_redirect' %}" class="block text-[13px] text-slate-500 hover:text-slate-700 transition">Cancel — Keep 2FA Enabled</a>
</div>
{% endblock %}
