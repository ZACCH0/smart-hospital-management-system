{% extends 'base.html' %}

{% block title %}Disable 2FA - SHMS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16">
    <div class="bg-white shadow rounded-xl p-8 text-center">

        <div class="w-14 h-14 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-7 h-7 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
            </svg>
        </div>

        <h1 class="text-2xl font-bold text-gray-800 mb-2">Disable Two-Factor Authentication</h1>
        <p class="text-gray-500 text-sm mb-6">
            Disabling 2FA will make your account less secure.
            You will be required to set it up again on next login.
        </p>

        <form method="post">
            {% csrf_token %}
            <button type="submit"
                    class="w-full bg-red-600 text-white py-3 rounded-lg hover:bg-red-700 transition font-medium mb-3">
                Yes, Disable 2FA
            </button>
        </form>

        <a href="{% url 'accounts:role_redirect' %}"
           class="block text-sm text-gray-500 hover:text-gray-700 transition">
            Cancel — Keep 2FA Enabled
        </a>

    </div>
</div>
{% endblock %}
