{% extends 'base.html' %}

{% block title %}Page Not Found - SHMS{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center">
    <div class="text-center max-w-md mx-auto">

        <div class="w-24 h-24 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-12 h-12 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        </div>

        <h1 class="text-6xl font-extrabold text-blue-700 mb-2">404</h1>
        <h2 class="text-2xl font-bold text-gray-800 mb-3">Page Not Found</h2>
        <p class="text-gray-500 mb-8">
            The page you are looking for does not exist or has been moved.
            Please check the URL or return to the dashboard.
        </p>

        <div class="flex gap-3 justify-center">
            <a href="javascript:history.back()"
               class="bg-gray-100 text-gray-700 px-5 py-2 rounded-lg hover:bg-gray-200 transition text-sm font-medium">
                ← Go Back
            </a>
            <a href="{% url 'home' %}"
               class="bg-blue-700 text-white px-5 py-2 rounded-lg hover:bg-blue-800 transition text-sm font-medium">
                Go to Homepage
            </a>
        </div>

    </div>
</div>
{% endblock %}
