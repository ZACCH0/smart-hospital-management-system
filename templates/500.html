{% extends 'base.html' %}

{% block title %}Server Error - SHMS{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center">
    <div class="text-center max-w-md mx-auto">

        <div class="w-24 h-24 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-12 h-12 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
            </svg>
        </div>

        <h1 class="text-6xl font-extrabold text-yellow-600 mb-2">500</h1>
        <h2 class="text-2xl font-bold text-gray-800 mb-3">Server Error</h2>
        <p class="text-gray-500 mb-8">
            Something went wrong on our end. Our team has been notified.
            Please try again in a few minutes.
        </p>

        <div class="flex gap-3 justify-center">
            <a href="javascript:history.back()"
               class="bg-gray-100 text-gray-700 px-5 py-2 rounded-lg hover:bg-gray-200 transition text-sm font-medium">
                ← Go Back
            </a>
            <a href="{% url 'home' %}"
               class="bg-blue-700 text-white px-5 py-2 rounded-lg hover:bg-blue-800 transition text-sm font-medium">
                Go to Homepage
            </a>
        </div>

    </div>
</div>
{% endblock %}
