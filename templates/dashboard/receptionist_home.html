{% extends 'base.html' %}

{% block title %}Receptionist Dashboard{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold text-blue-700 mb-6">Welcome, {{ user.get_full_name }}</h1>

<div class="grid md:grid-cols-2 gap-6">
    <a href="{% url 'appointments:appointment_list' %}"
       class="bg-white shadow rounded-lg p-6 hover:shadow-md transition">
        <h2 class="text-lg font-semibold">Manage Appointments</h2>
        <p class="text-gray-500 text-sm mt-1">{{ pending_count }} pending appointment(s)</p>
    </a>

    <a href="{% url 'appointments:book_appointment' %}"
       class="bg-white shadow rounded-lg p-6 hover:shadow-md transition">
        <h2 class="text-lg font-semibold">Book New Appointment</h2>
        <p class="text-gray-500 text-sm mt-1">Schedule on behalf of a patient</p>
    </a>
</div>
{% endblock %}
