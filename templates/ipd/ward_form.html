{% extends 'base.html' %}

{% block title %}{{ title }} – SHMS{% endblock %}

{% block content %}
<div class="w-full max-w-lg md:max-w-xl mx-auto">
    <div class="flex items-center gap-3 mb-6">
        <a href="{% url 'ipd:ward_board' %}" class="text-gray-400 hover:text-primary transition">← Back</a>
        <h1 class="text-xl lg:text-2xl font-bold text-primary">{{ title }}</h1>
    </div>

    <div class="bg-white shadow rounded-xl p-5 sm:p-6 lg:p-8">
        <form method="post" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium mb-1">Ward Name</label>
                {{ form.name }}
                {% if form.name.errors %}<p class="text-red-500 text-xs mt-1">{{ form.name.errors.0 }}</p>{% endif %}
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Ward Type</label>
                {{ form.ward_type }}
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Floor</label>
                {{ form.floor }}
            </div>

            <div class="flex items-end pb-2">
                <label class="inline-flex items-center gap-2 text-sm text-slate-700">
                    {{ form.is_active }} Active
                </label>
            </div>

            <div class="md:col-span-2">
                <label class="block text-sm font-medium mb-1">Description</label>
                {{ form.description }}
            </div>

            <button type="submit"
                    class="md:col-span-2 btn-shine w-full bg-primary text-white py-3 rounded-lg hover:bg-secondary transition font-medium">
                Save Ward
            </button>
        </form>
    </div>
</div>
{% endblock %}
